# Included inside the existing Atlas HTTP server block. The service listens on loopback only.
location ~ ^/atlas(?:\.(?:red-panda|polar-bear|hippopotamus))?/media/([a-f0-9]{32})/(thumb|profile)$ {
    proxy_pass http://127.0.0.1:4175/media/$1/$2;
    proxy_http_version 1.1;
    proxy_set_header Host 127.0.0.1;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header If-None-Match $http_if_none_match;
    proxy_pass_request_headers off;
    proxy_pass_request_body off;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_max_temp_file_size 0;
    proxy_cache off;
    proxy_connect_timeout 2s;
    proxy_read_timeout 8s;
    proxy_send_timeout 8s;
    proxy_hide_header Set-Cookie;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
}
