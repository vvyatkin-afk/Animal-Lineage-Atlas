name: Atlas CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-build-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:python
      - run: npm run validate:data
      - run: npm run check:no-photos
      - run: npm run build
      - run: python3 tools/check_no_animal_photos.py dist
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
